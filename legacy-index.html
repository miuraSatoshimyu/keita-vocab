<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>keita-vocab — 毎日の英語</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1a2030; --sub: #5b6474;
    --line: #e3e6ec; --accent: #2f6fed; --accent-soft: #e8f0fe;
    --ok: #188554; --ok-soft: #e3f4ea; --warn: #b3560e; --warn-soft: #fdeedd;
    --shadow: 0 1px 3px rgba(20,30,60,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141f; --card: #1a2030; --text: #eef1f7; --sub: #98a2b6;
      --line: #2a3245; --accent: #6d9bff; --accent-soft: #223252;
      --ok: #4fc98b; --ok-soft: #17392a; --warn: #f0a45c; --warn-soft: #3d2a15;
      --shadow: 0 1px 3px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.65; padding-bottom: 96px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 4px; }
  header h1 { font-size: 18px; letter-spacing: .02em; }
  header .streak { font-size: 13px; color: var(--sub); }
  .datebar { font-size: 13px; color: var(--sub); margin-bottom: 14px; }
  .banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .banner.ok   { background: var(--ok-soft); color: var(--ok); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }
  h2 { font-size: 14px; color: var(--sub); text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .word-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .word-head .w { font-size: 20px; font-weight: 700; }
  .word-head .ipa { font-size: 13px; color: var(--sub); }
  .word-head .pos { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; }
  .word-head .chev { margin-left: auto; color: var(--sub); transition: transform .2s; }
  .word-body { display: none; margin-top: 10px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .card.open .word-body { display: block; }
  .card.open .chev { transform: rotate(180deg); }
  .word-body .ja { font-weight: 600; margin-bottom: 4px; }
  .word-body .en { color: var(--sub); font-size: 13px; margin-bottom: 8px; }
  .word-body ul { padding-left: 18px; margin: 4px 0 8px; }
  .word-body li { margin-bottom: 4px; }
  .coll { font-size: 12.5px; color: var(--sub); }
  .learn-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--sub); user-select: none; cursor: pointer; }
  .learn-check input { width: 20px; height: 20px; accent-color: var(--ok); }
  .quiz .q { font-size: 14px; margin-bottom: 8px; }
  .quiz .ans { display: none; font-size: 14px; background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 8px 12px; }
  .quiz.revealed .ans { display: block; }
  .quiz button.reveal { border: 1px solid var(--line); background: none; color: var(--accent); border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
  .quiz.revealed button.reveal { display: none; }
  .practice { font-size: 14px; }
  .note { font-size: 13px; color: var(--sub); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
  .footerbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .footerbar .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .progress { flex: 1; font-size: 12.5px; color: var(--sub); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s; }
  a.done-btn { text-decoration: none; text-align: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; border-radius: 12px; padding: 12px 22px; opacity: .4; pointer-events: none; }
  a.done-btn.ready { opacity: 1; pointer-events: auto; }
  a.done-btn.finished { background: var(--ok); opacity: 1; pointer-events: none; }
  .history { display: flex; flex-wrap: wrap; gap: 6px; }
  .history .d { font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--sub); }
  .history .d.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .history .d.cur { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .loading { text-align: center; color: var(--sub); padding: 48px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">読み込み中…</div></div>
<div class="footerbar" id="footer" style="display:none">
  <div class="inner">
    <div class="progress"><span id="ptext">0 / 0</span><div class="bar"><i id="pbar"></i></div></div>
    <a class="done-btn" id="doneBtn" target="_blank" rel="noopener">完了 ✓</a>
  </div>
</div>
<script>
const REPO = 'miuraSatoshimyu/keita-vocab';
const bust = () => '?t=' + Date.now();
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function j(path) { const r = await fetch(path + bust()); if (!r.ok) throw new Error(path); return r.json(); }

function streakOf(doneDates) {
  const set = new Set(doneDates);
  if (!doneDates.length) return 0;
  let n = 0;
  let d = new Date();
  for (;;) {
    const key = d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
    if (set.has(key)) { n++; d.setDate(d.getDate() - 1); }
    else if (n === 0 && key === new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' })) { d.setDate(d.getDate() - 1); n = -0; if (!set.has(d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' }))) break; }
    else break;
    if (n > 3650) break;
  }
  return n;
}

(async () => {
  const app = document.getElementById('app');
  let idx, progress;
  try {
    [idx, progress] = await Promise.all([j('data/index.json'), j('progress.json')]);
  } catch (e) {
    app.innerHTML = '<div class="loading">データを読み込めませんでした。通信環境を確認してリロードしてください。</div>';
    return;
  }
  const doneMap = progress.done || {};
  const lessons = (idx.lessons || []).slice().sort();
  const pending = lessons.filter(d => !doneMap[d]);
  const current = pending.length ? pending[0] : lessons[lessons.length - 1];
  const isDone = !!doneMap[current];
  let lesson;
  try { lesson = await j('data/lessons/' + current + '.json'); }
  catch (e) { app.innerHTML = '<div class="loading">レッスンが見つかりません。</div>'; return; }

  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  const streak = streakOf(Object.keys(doneMap));
  const typeLabel = { new: '新語 + 復習', review: '週次復習', practice: '実践課題' }[lesson.day_type] || 'レッスン';

  app.innerHTML = '';
  app.append($(`<header><h1>🇬🇧 keita-vocab</h1><div class="streak">🔥 連続 ${streak} 日 ・ 完了 ${Object.keys(doneMap).length} 回</div></header>`));
  app.append($(`<div class="datebar">${esc(lesson.date)} (${esc(lesson.weekday || '')}) — ${esc(typeLabel)}</div>`));

  if (isDone) {
    app.append($(`<div class="banner ok">✅ このレッスンは完了済みです。明日の朝6:30に次のレッスンが届きます。</div>`));
  } else if (current < today) {
    app.append($(`<div class="banner warn">⏳ ${esc(current)} のレッスンが未完了です。これを終えないと次の日に進めません!</div>`));
  } else {
    app.append($(`<div class="banner info">📚 今日のレッスンです。すべてのカードをチェックすると「完了」が押せます。</div>`));
  }
  if (lesson.status_note) app.append($(`<div class="note">${esc(lesson.status_note)}</div>`));

  const checkables = [];
  const refresh = () => {
    const done = checkables.filter(c => c()).length;
    document.getElementById('ptext').textContent = `チェック ${done} / ${checkables.length}`;
    document.getElementById('pbar').style.width = (checkables.length ? (100 * done / checkables.length) : 0) + '%';
    const btn = document.getElementById('doneBtn');
    if (!isDone) btn.classList.toggle('ready', done === checkables.length && checkables.length > 0);
  };

  if (lesson.new_words && lesson.new_words.length) {
    app.append($('<h2>今日の新語</h2>'));
    lesson.new_words.forEach(w => {
      const card = $(`<div class="card">
        <div class="word-head"><span class="w">${esc(w.word)}</span><span class="ipa">${esc(w.ipa || '')}</span><span class="pos">${esc(w.pos || '')}</span><span class="chev">▾</span></div>
        <div class="word-body">
          <div class="ja">${esc(w.meaning_ja || '')}</div>
          <div class="en">${esc(w.meaning_en || '')}</div>
          <ul>${(w.examples || []).map(e => `<li>${esc(e)}</li>`).join('')}</ul>
          <div class="coll">💬 ${(w.collocations || []).map(esc).join(' / ')}</div>
          <label class="learn-check"><input type="checkbox">意味を思い出せた / 覚えた</label>
        </div>
      </div>`);
      card.querySelector('.word-head').addEventListener('click', () => card.classList.toggle('open'));
      const cb = card.querySelector('input');
      cb.addEventListener('change', refresh);
      checkables.push(() => cb.checked);
      app.append(card);
    });
  }

  if (lesson.review_quiz && lesson.review_quiz.length) {
    app.append($('<h2>復習クイズ(まず頭の中で答えてから開く)</h2>'));
    lesson.review_quiz.forEach((q, i) => {
      const el = $(`<div class="card quiz">
        <div class="q">Q${i + 1}. ${esc(q.q)}</div>
        <button class="reveal">答えを見る</button>
        <div class="ans">${esc(q.answer)}</div>
      </div>`);
      const btn = el.querySelector('.reveal');
      btn.addEventListener('click', () => { el.classList.add('revealed'); refresh(); });
      checkables.push(() => el.classList.contains('revealed'));
      app.append(el);
    });
  }

  if (lesson.practice && lesson.practice.length) {
    app.append($('<h2>実践</h2>'));
    lesson.practice.forEach(p => {
      const el = $(`<div class="card practice">✍️ ${esc(p)}<label class="learn-check"><input type="checkbox">やってみた</label></div>`);
      const cb = el.querySelector('input');
      cb.addEventListener('change', refresh);
      checkables.push(() => cb.checked);
      app.append(el);
    });
  }

  app.append($('<h2>これまで</h2>'));
  const hist = $('<div class="history"></div>');
  lessons.slice(-30).forEach(d => {
    hist.append($(`<span class="d ${doneMap[d] ? 'done' : (d === current ? 'cur' : '')}">${d.slice(5)}${doneMap[d] ? ' ✓' : ''}</span>`));
  });
  app.append(hist);

  const footer = document.getElementById('footer');
  footer.style.display = '';
  const btn = document.getElementById('doneBtn');
  if (isDone) {
    btn.textContent = '完了済み ✓';
    btn.classList.add('finished');
    document.getElementById('ptext').textContent = 'おつかれさまでした';
    document.getElementById('pbar').style.width = '100%';
  } else {
    const title = encodeURIComponent('done: ' + current);
    const body = encodeURIComponent('keita-vocab アプリからの完了報告です。このIssueを作成(Submit)すると進捗が記録され、自動でクローズされます。');
    btn.href = `https://github.com/${REPO}/issues/new?title=${title}&body=${body}`;
    refresh();
  }
})();
</script>
</body>
</html>
