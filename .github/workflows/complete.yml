name: Record completion

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  record:
    if: startsWith(github.event.issue.title, 'done:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const m = title.match(/done:\s*(\d{4}-\d{2}-\d{2})/);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!m) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: '⚠️ タイトル形式が不正です。`done: YYYY-MM-DD` の形式で作成してください。' });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });
              return;
            }
            const date = m[1];
            const path = 'progress.json';
            const f = await github.rest.repos.getContent({ owner, repo, path });
            const progress = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
            let msg;
            if (progress.done[date]) {
              msg = `ℹ️ ${date} はすでに完了記録済みです。`;
            } else {
              progress.done[date] = new Date().toISOString();
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message: `done: ${date}`,
                content: Buffer.from(JSON.stringify(progress, null, 2) + '\n').toString('base64'),
                sha: f.data.sha
              });
              msg = `✅ ${date} のレッスンを完了として記録しました。おつかれさまです!明日の朝、次のレッスンが届きます。`;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
            await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });
